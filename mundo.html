<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mundo Medieval - Motor Editable</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; }
        canvas { display: block; image-rendering: pixelated; }
        #ui { position: fixed; top: 10px; left: 10px; color: white; font-family: monospace; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; pointer-events: none;}
    </style>
</head>
<body>
    <div id="ui">Controles: WASD. Sistema de Edición Activo.</div>
    <canvas id="juegoCanvas"></canvas>

    <script>
        const canvas = document.getElementById('juegoCanvas');
        const ctx = canvas.getContext('2d');
        const TILE_SIZE = 32;
        const MUNDO_ANCHO_TILES = 100;
        const MUNDO_ALTO_TILES = 100;

        // Mapa Base
        const mapa = Array.from({ length: MUNDO_ALTO_TILES }, () => Array(MUNDO_ANCHO_TILES).fill(0));

        const jugador = { x: 1600, y: 1600, w: 16, h: 24, speed: 3, dx: 0, dy: 0, frame: 0, mirandoDerecha: true };
        const camara = { x: 0, y: 0, suavizado: 0.1 };
        const teclas = {};
        window.addEventListener('keydown', (e) => teclas[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => teclas[e.key.toLowerCase()] = false);

        function buclePrincipal() {
            // Movimiento básico
            jugador.dx = 0; jugador.dy = 0;
            if (teclas['w']) jugador.dy = -jugador.speed;
            if (teclas['s']) jugador.dy = jugador.speed;
            if (teclas['a']) { jugador.dx = -jugador.speed; jugador.mirandoDerecha = false; }
            if (teclas['d']) { jugador.dx = jugador.speed; jugador.mirandoDerecha = true; }
            jugador.x += jugador.dx; jugador.y += jugador.dy;

            // Cámara
            camara.x += (jugador.x + jugador.w/2 - canvas.width/2 - camara.x) * camara.suavizado;
            camara.y += (jugador.y + jugador.h/2 - canvas.height/2 - camara.y) * camara.suavizado;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dibujarMapa();
            dibujarJugador();
            requestAnimationFrame(buclePrincipal);
        }

        function dibujarMapa() {
            // Leer modificaciones externas del localStorage
            const mods = JSON.parse(localStorage.getItem('mapaModificado') || '{}');

            for (let y = 0; y < MUNDO_ALTO_TILES; y++) {
                for (let x = 0; x < MUNDO_ANCHO_TILES; x++) {
                    const drawX = x * TILE_SIZE - camara.x;
                    const drawY = y * TILE_SIZE - camara.y;
                    
                    // Si el tile está en la pantalla
                    if (drawX > -TILE_SIZE && drawX < canvas.width && drawY > -TILE_SIZE && drawY < canvas.height) {
                        
                        // Prioridad: 1º Modificación, 2º Mapa base (Pasto)
                        const tipo = mods[`${x},${y}`] || 'pasto';
                        
                        ctx.fillStyle = (tipo === 'agua') ? '#1e90ff' : 
                                        (tipo === 'montaña') ? '#708090' : 
                                        (tipo === 'camino') ? '#deb887' : '#228b22';
                        
                        ctx.fillRect(drawX, drawY, TILE_SIZE, TILE_SIZE);
                    }
                }
            }
        }

        function dibujarJugador() {
            ctx.fillStyle = 'red';
            ctx.fillRect(jugador.x - camara.x, jugador.y - camara.y, jugador.w, jugador.h);
        }

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        buclePrincipal();
    </script>
</body>
</html>
