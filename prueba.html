
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mundo Medieval Damian y Agus | Exploración Activa</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; }
        canvas { display: block; image-rendering: pixelated; }
        #ui { position: fixed; top: 10px; left: 10px; color: white; font-family: monospace; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; pointer-events: none;}
    </style>
</head>
<body>
    <div id="ui">Controles: WASD (Mover), Shift (Correr)</div>
    <canvas id="juegoCanvas"></canvas>

    <script>
        const canvas = document.getElementById('juegoCanvas');
        const ctx = canvas.getContext('2d');
        
        // --- 1. AQUÍ CARGAMOS LO QUE MODIFIQUES EN OTROS HTML ---
        function obtenerDatosExternos() {
            return {
                objetos: JSON.parse(localStorage.getItem('objetosMundo')) || [],
                jugadorSkin: localStorage.getItem('skinJugador') || 'default'
            };
        }

        // --- TU CÓDIGO ORIGINAL SE MANTIENE AQUÍ ---
        const TILE_SIZE = 32;
        const MUNDO_ANCHO_TILES = 100;
        const MUNDO_ALTO_TILES = 100;

        // ... (Aquí van todas tus variables: texturas, mapa, jugador, etc.) ...
        // ... (Mantén toda tu lógica de generación de mapa y configuraciones originales) ...

        function buclePrincipal() {
            // Obtenemos los datos externos al inicio de cada frame
            const datos = obtenerDatosExternos();
            
            actualizarJugador();
            actualizarCamara();
            dibujarMundo();
            
            // --- 2. DIBUJAMOS LOS ELEMENTOS QUE VENGAN DE OTROS HTML ---
            datos.objetos.forEach(obj => {
                ctx.fillStyle = obj.color;
                ctx.fillRect(obj.x * TILE_SIZE - camara.x, obj.y * TILE_SIZE - camara.y, TILE_SIZE, TILE_SIZE);
            });

            dibujarJugador(); // Aquí, si quieres, puedes cambiar el color según datos.jugadorSkin
            requestAnimationFrame(buclePrincipal);
        }

        // --- (Pega aquí todas tus funciones originales intactas: actualizarJugador, actualizarCamara, dibujarMundo, etc.) ---

        // Iniciar
        function ajustarCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', ajustarCanvas);
        ajustarCanvas();
        buclePrincipal();

    </script>
</body>
</html>
