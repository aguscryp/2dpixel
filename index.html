<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Damian y Agus | Medieval Saga</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Pirata+One&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #050505; 
                     cursor: url('https://cdn-icons-png.flaticon.com/32/1797/1797825.png'), auto; }
        
        /* Preloader */
        #preloader { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; 
                     flex-direction: column; align-items: center; justify-content: center; }
        
        /* Contenedor principal oculto inicialmente para el fade-in */
        #main-content { opacity: 0; transition: opacity 1s ease-in; }

        #fondo-canvas { position: absolute; top: 0; left: 0; z-index: 1; opacity: 0.2; }
        #contenedor-central { position: relative; z-index: 2; height: 100vh; display: flex; 
                             flex-direction: column; align-items: center; justify-content: center; }

        .logo { color: #d4af37; font-size: 4.5rem; text-transform: uppercase; 
                text-shadow: 0 0 25px rgba(212,175,55,0.6); border-bottom: 4px solid #d4af37; 
                padding-bottom: 10px; letter-spacing: 6px; font-family: 'Pirata One', cursive; }

        .btn-jugar { margin-top: 50px; padding: 15px 70px; font-size: 2rem; background: transparent; 
                     color: #d4af37; border: 2px solid #d4af37; cursor: pointer; transition: 0.4s; 
                     text-transform: uppercase; font-family: 'MedievalSharp'; }
        
        .btn-jugar:hover { background: #d4af37; color: #000; transform: scale(1.08); box-shadow: 0 0 40px #d4af37; }

        #panel-audio { position: absolute; bottom: 30px; right: 30px; z-index: 10; background: rgba(0,0,0,0.7); 
                      padding: 15px; border: 1px solid #d4af37; display: flex; align-items: center; gap: 15px; color: #d4af37; }
    </style>
</head>
<body>

    <div id="preloader"><h2 style="color:#d4af37; font-family:'MedievalSharp';">FORJANDO EL MUNDO...</h2></div>

    <div id="main-content">
        <canvas id="fondo-canvas"></canvas>
        <div id="contenedor-central">
            <div class="logo">Damian y Agus</div>
            <button class="btn-jugar" onclick="iniciarJuego()">Jugar</button>
        </div>

        <div id="panel-audio">
            <span>Volumen</span>
            <input type="range" min="0" max="1" step="0.1" value="0.5" oninput="ajustarVolumen(this.value)">
        </div>
    </div>

    <audio id="musica" loop autoplay><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"></audio>
    <audio id="sonido-click" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

    <script>
        // Forzamos la desaparición del preloader a los 2 segundos
        setTimeout(() => {
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('main-content').style.opacity = '1';
            iniciarCanvas(); // Iniciamos el canvas después del preloader
        }, 2000);

        function iniciarJuego() {
            document.getElementById('sonido-click').play();
            const btn = document.querySelector('.btn-jugar');
            btn.innerText = "ENTRANDO...";
            setTimeout(() => window.location.href = 'mundo.html', 2000);
        }

        function iniciarCanvas() {
            const canvas = document.getElementById('fondo-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            
            const objetos = Array.from({length: 12}, () => ({
                icon: ['⚔️', '🛡️', '🏰', '👑'][Math.floor(Math.random()*4)],
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                speed: Math.random() * 0.5 + 0.2
            }));

            function animar() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                objetos.forEach(o => {
                    ctx.font = '30px serif';
                    ctx.fillText(o.icon, o.x, o.y);
                    o.y += o.speed;
                    if (o.y > canvas.height) o.y = -50;
                });
                requestAnimationFrame(animar);
            }
            animar();
        }

        function ajustarVolumen(v) { document.getElementById('musica').volume = v; }
    </script>
</body>
</html>
